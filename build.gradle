plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

fabricApi {
	configureTests {
		// Client game test: starts Minecraft with the mod, makes a world and plays chat commands.
		createSourceSet = true
		modId = "twitchplays-gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}

tasks.register('gametestJar', Jar) {
	from sourceSets.gametest.output
	archiveClassifier = 'gametest'
}

// Same game test, but against build/libs/twitchplays-*.jar and the released Fabric API jar.
tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	jvmArgs.add('-Dfabric.client.gametest')
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mods for runProductionClientGameTest, which tests the built jar in a real Fabric install.
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionRuntimeMods files(tasks.named('gametestJar'))

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}
